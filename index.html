<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-white text-black p-8">
    <h1 class="text-3xl font-bold mb-8">Login</h1>

    <h2 class="text-xl font-bold mb-3">Crear usuario</h2>

    <form id="registerForm" class="mb-8">
      <div class="mb-3">
        <label for="name" class="block mb-1">Nombre</label>
        <input
          type="text"
          id="name"
          class="border border-black px-2 py-1 w-80"
          required
        />
      </div>

      <div class="mb-3">
        <label for="registerUsername" class="block mb-1"
          >Nombre de usuario</label
        >
        <input
          type="text"
          id="registerUsername"
          class="border border-black px-2 py-1 w-80"
          required
        />
      </div>

      <div class="mb-3">
        <label for="registerPassword" class="block mb-1">Contraseña</label>
        <input
          type="password"
          id="registerPassword"
          class="border border-black px-2 py-1 w-80"
          required
        />
      </div>

      <button type="submit" class="border border-black px-3 py-1">
        Crear usuario
      </button>
    </form>

    <h2 class="text-xl font-bold mb-3">Autenticar usuario</h2>

    <form id="loginForm" class="mb-8">
      <div class="mb-3">
        <label for="loginUsername" class="block mb-1">Nombre de usuario</label>
        <input
          type="text"
          id="loginUsername"
          class="border border-black px-2 py-1 w-80"
          required
        />
      </div>

      <div class="mb-3">
        <label for="loginPassword" class="block mb-1">Contraseña</label>
        <input
          type="password"
          id="loginPassword"
          class="border border-black px-2 py-1 w-80"
          required
        />
      </div>

      <button type="submit" class="border border-black px-3 py-1">
        Entrar
      </button>
    </form>

    <h2 class="text-xl font-bold mb-3">Información del usuario</h2>

    <button id="showUserButton" class="border border-black px-3 py-1 mb-4">
      Mostrar información
    </button>

    <div id="userInfo" class="mt-3">
      Aquí aparecerá la información del usuario.
    </div>

    <script src="app.js"></script>
  </body>
</html>
